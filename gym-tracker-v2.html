<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Трекер тренировок</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #21252e;
    --accent: #4f8ef7;
    --accent2: #34d399;
    --text: #e8e9ec;
    --text-dim: #8b8f99;
    --border: #2a2e38;
    --danger: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 16px 16px 8px;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sync-status {
    position: absolute;
    top: 18px;
    right: 16px;
    font-size: 12px;
    color: var(--text-dim);
    transition: color .2s;
  }
  .sync-status.ok { color: var(--accent2); }
  .sync-status.err { color: var(--danger); }
  .sync-status.syncing { color: var(--accent); }
  .date-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .date-row input[type=date] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 15px;
    flex: 1;
  }
  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  main { padding: 8px 16px 16px; }
  .exercise-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .exercise-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .exercise-name { font-size: 15px; font-weight: 600; }
  .exercise-target { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .check-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: transparent;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 16px;
  }
  .check-btn.done {
    background: var(--accent2);
    border-color: var(--accent2);
    color: white;
  }
  .sets-list { display: flex; flex-direction: column; gap: 6px; }
  .set-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card2);
    border-radius: 10px;
    padding: 6px 8px;
  }
  .set-num { font-size: 12px; color: var(--text-dim); width: 18px; text-align: center; }
  .set-row input {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    text-align: center;
    width: 100%;
    padding: 4px 0;
  }
  .set-row input::placeholder { color: var(--text-dim); opacity: 0.6; }
  .set-label { font-size: 10px; color: var(--text-dim); }
  .set-col { display: flex; flex-direction: column; flex: 1; }
  .set-x { color: var(--text-dim); font-size: 13px; }
  .set-remove {
    color: var(--danger);
    font-size: 18px;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .add-set-btn {
    margin-top: 8px;
    background: var(--card2);
    border: 1px dashed var(--border);
    color: var(--accent);
    border-radius: 10px;
    padding: 8px;
    font-size: 13px;
    width: 100%;
  }
  .day-note {
    font-size: 13px;
    color: var(--text-dim);
    padding: 6px 4px 12px;
  }
  footer {

    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);

    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    padding: 8px 4px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .nav-btn.active { color: var(--accent); background: rgba(79,142,247,0.12); }
  .nav-icon { font-size: 18px; }
  .history-entry {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .history-date { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .history-day { font-size: 12px; color: var(--accent); margin-bottom: 8px; }
  .history-ex { font-size: 13px; margin: 4px 0; color: var(--text); }
  .history-ex .ename { color: var(--text-dim); }

  .cal-title { font-size:16px; font-weight:600; }
  .cal-nav { background:var(--card); border:1px solid var(--border); color:var(--text); width:38px; height:38px; border-radius:10px; font-size:20px; line-height:1; }
  .cal-nav:active { background:var(--card2); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-dow { text-align:center; font-size:11px; color:var(--text-dim); padding-bottom:2px; }
  .cal-cell { aspect-ratio:1/1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:14px; position:relative; border:1px solid transparent; }
  .cal-cell.empty { visibility:hidden; }
  .cal-cell.blank { color:var(--text-dim); opacity:0.4; }
  .cal-cell.today { border-color:var(--text-dim); }
  .cal-cell.has { font-weight:700; cursor:pointer; }
  .cal-cell.gym { background:rgba(79,142,247,0.18); color:#d5e4ff; }

  .hist-row:active { background:var(--card2); }
  .hist-row-day { text-align:center; min-width:34px; font-size:20px; font-weight:700; line-height:1; }
  .hist-row-day span { display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; font-weight:500; margin-top:2px; }
  .hist-row-main { flex:1; min-width:0; }
  .hist-row-title { font-size:14px; font-weight:600; }
  .hist-row-meta { font-size:12px; color:var(--text-dim); margin-top:2px; }
  .hist-row-arrow { color:var(--text-dim); font-size:22px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fadeIn .15s ease; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .modal { background:var(--card); width:100%; max-width:600px; max-height:86vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px 18px 34px; border:1px solid var(--border); }

  .modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px; }
  .modal-title { font-size:19px; font-weight:700; }
  .modal-sub { font-size:13px; color:var(--accent); margin-top:3px; }
  .modal-close { background:var(--card2); border:none; color:var(--text); width:34px; height:34px; border-radius:10px; font-size:15px; flex-shrink:0; }
  .badge-row { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 2px; }
  .badge { font-size:12px; padding:6px 10px; border-radius:10px; background:var(--card2); color:var(--text-dim); }
  .badge.on { background:rgba(52,211,153,0.15); color:var(--accent2); }
  .badge.off { opacity:0.55; }
  .md-ex { background:var(--card2); border-radius:12px; padding:12px; margin-top:10px; }
  .md-ex-name { font-size:14px; font-weight:600; margin-bottom:8px; }
  .md-sets { display:flex; flex-wrap:wrap; gap:6px; }
  .md-set { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:4px 9px; font-size:13px; }
  .md-set .w { font-weight:700; }
  .md-set .r { color:var(--text-dim); }
  .md-empty-ex { color:var(--text-dim); font-size:13px; }
  .md-note { margin-top:8px; font-size:13px; color:var(--text-dim); border-left:2px solid var(--accent); padding-left:9px; }
  .md-edit { width:100%; margin-top:18px; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:600; }
  .md-edit:active { filter:brightness(1.12); }
  .md-delete { width:100%; margin-top:10px; background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:12px; padding:12px; font-size:14px; }
  .md-delete:active { background:rgba(248,113,113,0.12); }
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
  .save-toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent2);
    color: white;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .save-toast.show { opacity: 1; }
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin: 14px 4px 8px;
  }
  .weekly-check {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .wc-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 80px;
    justify-content: center;
  }
  .wc-item.on { background: rgba(52,211,153,0.15); border-color: var(--accent2); color: var(--accent2); }
  .wc-item.bd-item { border-color: var(--accent); }
  .wc-item.bd-item.on { background: rgba(79,142,247,0.15); border-color: var(--accent); color: var(--accent); }
  .wc-item.locked { opacity: 0.4; }
  .bd-status { flex-basis: 100%; font-size: 12px; margin: -2px 2px 4px; }
  .bd-status.bd-ok { color: var(--accent2); }
  .bd-status.bd-failed { color: var(--danger); }
  .bd-status.bd-progress { color: var(--text-dim); }
  .cardio-toggle {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .weight-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .weight-input-row input {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 15px;
    width: 90px;
  }  .save-workout-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
  }
  .save-workout-btn.saved {
    background: var(--accent2);
  }  .history-delete-btn {
    background: transparent;
    border: none;
    font-size: 14px;
    padding: 4px 8px;
    flex-shrink: 0;
    opacity: 0.8;
    white-space: nowrap;
    border-radius: 8px;
  }
  .history-delete-btn:active {
    opacity: 1;
  }  .exercise-notes {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    min-height: 34px;
  }
  .exercise-notes::placeholder { color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">Тренировка</h1>
  <span id="syncStatus" class="sync-status"></span>

    <input type="date" id="dateInput">
  </div>
</header>

<div class="tabs" id="groupTabs"></div>

<main id="mainContent"></main>

<div class="save-toast" id="saveToast">Сохранено ✓</div>

<footer>

function readJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return (v === null || v === undefined) ? fallback : v;
  } catch (e) { return fallback; }
}

function setSyncStatus(text, cls) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (cls ? ' ' + cls : '');
}

// Full snapshot of everything stored locally.
function collectLocalState() {
  const workouts = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('workout:')) {
      const entry = readJSON(k, null);
      if (entry) workouts[k.slice('workout:'.length)] = entry;
    }
  }
  return {
    _savedAt: Date.now(),
    workouts,
    bodyweight: readJSON('bodyweight-log', {}),
    deleted: readJSON(TOMBSTONE_KEY, {})
  };
}

// Write a (merged) snapshot back into localStorage.
function applyState(state) {
  if (!state || typeof state !== 'object') return;
  const deleted = state.deleted || {};
  if (state.workouts) {
    for (const [date, entry] of Object.entries(state.workouts)) {
      localStorage.setItem('workout:' + date, JSON.stringify(entry));
    }
  }
  for (const date of Object.keys(deleted)) {
    localStorage.removeItem('workout:' + date);
  }
  if (state.bodyweight) localStorage.setItem('bodyweight-log', JSON.stringify(state.bodyweight));
  localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(deleted));
  cache = {}; // in-memory cache is stale after a merge
}

// Merge two snapshots without losing data. Newest-wins per record.
function mergeStates(local, remote) {
  if (!remote) return local;
  if (!local) return remote;

  // Tombstones: keep the newest deletion time per date.
  const deleted = {};
  for (const src of [local.deleted || {}, remote.deleted || {}]) {
    for (const [d, ts] of Object.entries(src)) {
      deleted[d] = Math.max(deleted[d] || 0, ts || 0);
    }
  }

  // Workouts: union of dates, newest _ts wins; a later deletion removes it.
  const workouts = {};
  const dates = new Set([...Object.keys(local.workouts || {}), ...Object.keys(remote.workouts || {})]);
  for (const d of dates) {
    const a = (local.workouts || {})[d];
    const b = (remote.workouts || {})[d];
    const chosen = !a ? b : !b ? a : ((a._ts || 0) >= (b._ts || 0) ? a : b);
    const delTs = deleted[d] || 0;
    if (delTs && delTs >= (chosen._ts || 0)) continue; // deletion is newer
    workouts[d] = chosen;
  }

  // Bodyweight: merge keys; on conflict the newer snapshot wins.
  const localNewer = (local._savedAt || 0) >= (remote._savedAt || 0);
  const bodyweight = localNewer
    ? { ...(remote.bodyweight || {}), ...(local.bodyweight || {}) }
    : { ...(local.bodyweight || {}), ...(remote.bodyweight || {}) };

  return {
    _savedAt: Math.max(local._savedAt || 0, remote._savedAt || 0),
    workouts, bodyweight, deleted
  };
}

// Pull remote, merge into local. Pushes back if the merge added anything.
async function pullFromCloud() {
  setSyncStatus('↕ синхронизация…', 'syncing');
  try {
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    const rec = body.record;
    const remote = (rec && (rec.workouts || rec.bodyweight || rec.deleted)) ? rec : null;
    const local = collectLocalState();
    const merged = mergeStates(local, remote);
    applyState(merged);

    const mergedSnap = JSON.stringify({ w: merged.workouts, b: merged.bodyweight, d: merged.deleted });
    const remoteSnap = remote
      ? JSON.stringify({ w: remote.workouts || {}, b: remote.bodyweight || {}, d: remote.deleted || {} })
      : null;
    if (mergedSnap !== remoteSnap) schedulePush(); // remote is missing local data

    setSyncStatus('☁ синхронизировано', 'ok');
    return true;
  } catch (e) {
    console.error('Cloud pull failed', e);
    setSyncStatus('⚠ офлайн', 'err');
    return false;
  }
}

// Push the full local snapshot to the cloud (debounced via schedulePush).
let pushInFlight = false;
let pushQueued = false;
async function pushToCloud() {
  if (pushInFlight) { pushQueued = true; return; }
  pushInFlight = true;
  setSyncStatus('↕ синхронизация…', 'syncing');
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(collectLocalState())
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setSyncStatus('☁ синхронизировано', 'ok');
  } catch (e) {
    console.error('Cloud push failed', e);
    setSyncStatus('⚠ не сохранено в облако', 'err');
  } finally {
    pushInFlight = false;
    if (pushQueued) { pushQueued = false; schedulePush(); }
  }
}
const schedulePush = debounce(pushToCloud, 1200);

function markDeleted(dateStr) {
  const tomb = readJSON(TOMBSTONE_KEY, {});
  tomb[dateStr] = Date.now();
  localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tomb));
}
function clearTombstone(dateStr) {
  const tomb = readJSON(TOMBSTONE_KEY, {});
  if (tomb[dateStr]) {
    delete tomb[dateStr];
    localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tomb));
  }
}

function getDayKeyFromDate(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const jsDay = d.getDay(); // 0=sun
  const idx = DAY_ORDER_JS.indexOf(jsDay);
  return DAY_KEYS[idx];
}

function getCutoffMonday() {
  const now = new Date();
  const day = now.getDay(); // 0=sun..6=sat
  let daysUntilNextMonday = (8 - day) % 7;
  if (daysUntilNextMonday === 0) daysUntilNextMonday = 7;
  const d = new Date(now);
  d.setDate(now.getDate() + daysUntilNextMonday);
  return d.toISOString().slice(0,10);
}
const CUTOFF_MONDAY = getCutoffMonday();
function isBeforeCutoff(dateStr) {
  return dateStr < CUTOFF_MONDAY;
}

const BD_MIN = 4, BD_MAX = 6;

// Monday..Sunday date strings of the week containing dateStr.
function getWeekDates(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const offset = (d.getDay() + 6) % 7; // days since Monday
  const mon = new Date(d); mon.setDate(d.getDate() - offset);
  return Array.from({ length: 7 }, (_, i) => {
    const x = new Date(mon); x.setDate(mon.getDate() + i);
    return x.toISOString().slice(0, 10);
  });
}

// BD Routine stats for the week containing dateStr.
// status: 'ok' (>= BD_MIN), 'progress' (can still reach BD_MIN), 'failed' (can't).
async function getBdWeekStats(dateStr) {
  const week = getWeekDates(dateStr);
  const todayStr = new Date().toISOString().slice(0, 10);
  let count = 0, reachable = 0;
  for (const ds of week) {
    const e = await loadEntry(ds);
    if (e && e.bdRoutine) count++;
    else if (ds >= todayStr) reachable++; // a still-open day this week
  }
  let status;
  if (count >= BD_MIN) status = 'ok';
  else if (count + reachable >= BD_MIN) status = 'progress';
  else status = 'failed';
  return { count, reachable, status };
}

function formatDateHuman(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const months = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

async function loadEntry(dateStr) {
  if (cache[dateStr]) return cache[dateStr];
  try {
    const raw = localStorage.getItem(`workout:${dateStr}`);
    if (raw) {
      const parsed = JSON.parse(raw);
      cache[dateStr] = parsed;
      return parsed;
    }
  } catch (e) {}
  const dayKey = getDayKeyFromDate(dateStr);
  const template = PROGRAM[dayKey];
  const fresh = {
    date: dateStr,
    dayKey: dayKey,
    cardio: false,
    bdRoutine: false,
    chinTucks: false,
    kegelMorning: false,
    kegelAfternoon: false,
    kegelEvening: false,
    saved: false,
    exercises: template.exercises.map(ex => ({
      name: ex.name,
      target: ex.target,
      muscle: ex.muscle,
      done: false,
      notes: '',
      sets: []
    }))
  };
  cache[dateStr] = fresh;
  return fresh;
}

async function saveEntry(dateStr) {
  const entry = cache[dateStr];
  if (!entry) return;
  try {
    entry._ts = Date.now();
    localStorage.setItem(`workout:${dateStr}`, JSON.stringify(entry));
    clearTombstone(dateStr);
    showToast();
    schedulePush();
  } catch (e) {
    console.error("Save failed", e);
  }
}

function showToast() {
  const t = document.getElementById('saveToast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}
const debouncedSave = debounce(saveEntry, 500);

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

let historyMonth = null; // Date = first day of the month currently shown in history

async function renderHistoryView() {
  const main = document.getElementById('mainContent');
  document.getElementById('pageTitle').textContent = 'История';
  main.innerHTML = '<div class="empty-state">Загрузка...</div>';

  // Collect all saved workouts keyed by date.
  const saved = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('workout:')) {
        const e = await loadEntry(k.slice('workout:'.length));
        if (e && e.saved) saved[e.date] = e;
      }
    }
  } catch (e) {}

  const dates = Object.keys(saved).sort();
  if (dates.length === 0) {
    main.innerHTML = '<div class="empty-state">Пока нет записей.<br>Заполни тренировку — она появится здесь.</div>';
    return;
  }

  // Default to the month of the most recent workout.
  if (!historyMonth) {
    const d = new Date(dates[dates.length - 1] + 'T12:00:00');
    historyMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  }

  drawHistory(main, saved);
}

function drawHistory(main, saved) {
  const year = historyMonth.getFullYear();
  const month = historyMonth.getMonth();
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const dow = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += '<div class="cal-cell empty"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const today = ds === todayStr ? ' today' : '';
    const entry = saved[ds];
    if (entry) {
      const loc = (PROGRAM[entry.dayKey] && PROGRAM[entry.dayKey].location) || 'gym';
      const cardio = entry.cardio ? '<span class="cal-cardio">🏃</span>' : '';
      cells += `<div class="cal-cell has ${loc}${today}" data-date="${ds}">${day}${cardio}</div>`;
    } else {
      cells += `<div class="cal-cell blank${today}">${day}</div>`;
    }
  }

  // Month workout list (newest first).
  const monthWorkouts = Object.keys(saved).filter(d => {
    const dt = new Date(d + 'T12:00:00');
    return dt.getFullYear() === year && dt.getMonth() === month;
  }).sort().reverse();

  let listHtml = '';
  for (const ds of monthWorkouts) {
    const e = saved[ds];
    const tpl = PROGRAM[e.dayKey] || { type: 'Тренировка', location: 'gym' };
    const exCount = e.exercises.filter(x => x.sets.some(s => s.weight || s.reps) || x.done).length;
    const setCount = e.exercises.reduce((n, x) => n + x.sets.filter(s => s.weight || s.reps).length, 0);
    const d = new Date(ds + 'T12:00:00');
    listHtml += `
      <div class="hist-row ${tpl.location}" data-date="${ds}">
        <div class="hist-row-day">${d.getDate()}<span>${dow[(d.getDay() + 6) % 7]}</span></div>
        <div class="hist-row-main">
          <div class="hist-row-title">${tpl.type}</div>
          <div class="hist-row-meta">${exCount} упр · ${setCount} подх${e.cardio ? ' · 🏃 кардио' : ''}</div>
        </div>
        <div class="hist-row-arrow">›</div>
      </div>`;
  }

  main.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-title">${monthNames[month]} ${year}</div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid">
      ${dow.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><i class="dot gym"></i>Зал</span>
      <span><i class="dot home"></i>Дома</span>
      <span>🏃 кардио</span>
    </div>
    <div class="section-title">Тренировки за месяц</div>
    <div id="histList">${listHtml || '<div class="empty-state" style="padding:24px;">В этом месяце нет тренировок</div>'}</div>
  `;

  document.getElementById('calPrev').onclick = () => { historyMonth = new Date(year, month - 1, 1); renderHistoryView(); };
  document.getElementById('calNext').onclick = () => { historyMonth = new Date(year, month + 1, 1); renderHistoryView(); };
  main.querySelectorAll('[data-date]').forEach(el => {
    el.onclick = () => openWorkoutDetail(el.dataset.date);
  });
}

    if (realSets.length === 0 && !ex.done && !ex.notes) return;
    const setsHtml = realSets.length
      ? `<div class="md-sets">${realSets.map(s => `<span class="md-set"><span class="w">${escHtml(s.weight || '—')}</span><span class="r"> кг × ${escHtml(s.reps || '—')}</span></span>`).join('')}</div>`
      : `<div class="md-empty-ex">${ex.done ? '✓ отмечено выполненным' : 'без подходов'}</div>`;
    const note = ex.notes ? `<div class="md-note">📝 ${escHtml(ex.notes)}</div>` : '';
    exHtml += `<div class="md-ex"><div class="md-ex-name">${ex.done ? '✓ ' : ''}${escHtml(ex.name)}</div>${setsHtml}${note}</div>`;
  });
  if (!exHtml) exHtml = '<div class="md-empty-ex" style="margin-top:12px;">Упражнения не заполнены</div>';

  const badges = `
    <div class="badge-row">
      <span class="badge ${entry.cardio ? 'on' : 'off'}">🏃 Кардио ${entry.cardio ? '✓' : '—'}</span>
      <span class="badge ${entry.bdRoutine ? 'on' : 'off'}">BD Routine ${entry.bdRoutine ? '✓' : '—'}</span>
      <span class="badge ${entry.chinTucks ? 'on' : 'off'}">Chin tucks ${entry.chinTucks ? '✓' : '—'}</span>
      <span class="badge ${kegelCount > 0 ? 'on' : 'off'}">Кегель ${kegelCount}/3</span>
    </div>`;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="modal-title">${formatDateHuman(dateStr)}</div>
          <div class="modal-sub">${escHtml(tpl.type)}${tpl.note ? ' · ' + escHtml(tpl.note) : ''}</div>
        </div>
        <button class="modal-close">✕</button>
      </div>
      ${badges}
      ${exHtml}
      <button class="md-edit">✏️ Редактировать тренировку</button>
      <button class="md-delete">🗑 Удалить тренировку</button>
    </div>`;
  document.body.appendChild(backdrop);

  const close = () => backdrop.remove();
  backdrop.onclick = (ev) => { if (ev.target === backdrop) close(); };
  backdrop.querySelector('.modal-close').onclick = close;

  backdrop.querySelector('.md-edit').onclick = () => {
    close();
    currentView = 'workout';
    currentDate = dateStr;
    currentDayKey = getDayKeyFromDate(dateStr);
    currentGroup = PROGRAM[currentDayKey].location;
    const di = document.getElementById('dateInput');
    if (di) di.value = dateStr;
    render();
    window.scrollTo(0, 0);
  };

  const delBtn = backdrop.querySelector('.md-delete');
  delBtn.onclick = () => {
    if (delBtn.dataset.confirming === 'true') {
      try {
        localStorage.removeItem(`workout:${dateStr}`);
        delete cache[dateStr];
        markDeleted(dateStr);
        schedulePush();
      } catch (e) {}
      close();
      renderHistoryView();
    } else {
      delBtn.dataset.confirming = 'true';
      delBtn.textContent = '✓ Точно удалить?';
      setTimeout(() => {
        if (delBtn.dataset.confirming === 'true') {
          delBtn.dataset.confirming = 'false';
          delBtn.textContent = '🗑 Удалить тренировку';
        }
      }, 3000);
    }
  };
}

async function renderWeightView() {
  const main = document.getElementById('mainContent');
  document.getElementById('pageTitle').textContent = 'Вес тела';
  main.innerHTML = '<div class="empty-state">Загрузка...</div>';

  let bwRaw = '{}';
  try {
    bwRaw = localStorage.getItem('bodyweight-log') || '{}';
  } catch (e) {}

  let log = {};
  try { log = JSON.parse(bwRaw); } catch (e) { log = {}; }

  main.innerHTML = `
    <div class="weight-input-row">
      <div style="flex:1;">
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">Вес на ${formatDateHuman(currentDate)}</div>
        <input type="number" inputmode="decimal" id="bwInput" placeholder="70.0" value="${log[currentDate] || ''}" />
        <span style="font-size:13px;color:var(--text-dim);margin-left:6px;">кг</span>
      </div>
    </div>
    <div class="section-title">История веса</div>
    <div id="bwHistory"></div>
  `;

  document.getElementById('bwInput').oninput = debounce(async (e) => {
    log[currentDate] = e.target.value;
    localStorage.setItem('bodyweight-log', JSON.stringify(log));
    showToast();
    schedulePush();
    renderBwHistory();
  }, 500);

  function renderBwHistory() {
    const dates = Object.keys(log).filter(d => log[d]).sort().reverse();
    const histDiv = document.getElementById('bwHistory');
    if (dates.length === 0) {
      histDiv.innerHTML = '<div class="empty-state">Пока нет записей веса</div>';
      return;
    }
    histDiv.innerHTML = dates.map(d => `
      <div class="history-entry" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;">
        <span style="font-size:14px;">${formatDateHuman(d)}</span>
        <span style="font-size:16px;font-weight:600;color:var(--accent);">${log[d]} кг</span>
      </div>
    `).join('');
  }
  renderBwHistory();
}

// ---------- ANALYTICS ----------

function computeWeeklyMuscleVolume() {
  const totals = {};
  DAY_KEYS.forEach(dayKey => {
    PROGRAM[dayKey].exercises.forEach(ex => {
      if (!ex.muscle || ex.muscle === 'neck' || ex.muscle === 'other') return;
      const match = ex.target.match(/^(\d+)/);
      const sets = match ? parseInt(match[1], 10) : 0;
      totals[ex.muscle] = (totals[ex.muscle] || 0) + sets;
    });
  });
  return totals;
}

function getVolumeStatus(sets, isPriority) {
  if (sets < LOWER_BOUND_SETS) return { label: 'Мало', color: '#f87171' };
  if (sets < MIN_OPTIMAL_SETS) return { label: isPriority ? 'Погранично' : 'Норм', color: '#fbbf24' };
  return { label: 'Хорошо', color: '#34d399' };
}

const BODY_ZONES = {
  chest:     { cx: 100, cy: 95,  rx: 26, ry: 18 },
  shoulders: { cx: 100, cy: 65,  rx: 42, ry: 14 },
  biceps:    { cx: 60,  cy: 110, rx: 10, ry: 22 },
  triceps:   { cx: 140, cy: 110, rx: 10, ry: 22 },
  back:      { cx: 100, cy: 95,  rx: 26, ry: 18 },
  abs:       { cx: 100, cy: 135, rx: 18, ry: 22 },
  quads:     { cx: 100, cy: 210, rx: 22, ry: 35 },
  glutes:    { cx: 100, cy: 175, rx: 22, ry: 14 },
  calves:    { cx: 100, cy: 275, rx: 14, ry: 24 },
  lowerback: { cx: 100, cy: 160, rx: 20, ry: 12 }
};

function renderBodySvg(totals) {
  const zones = Object.entries(BODY_ZONES).map(([muscle, z]) => {
    const sets = totals[muscle] || 0;
    const isPriority = PRIORITY_MUSCLES.includes(muscle);
    const status = getVolumeStatus(sets, isPriority);
    return `<ellipse cx="${z.cx}" cy="${z.cy}" rx="${z.rx}" ry="${z.ry}" fill="${status.color}" fill-opacity="0.55" stroke="${status.color}" stroke-width="2"/>
      <text x="${z.cx}" y="${z.cy+4}" font-size="9" fill="white" text-anchor="middle">${sets}</text>`;
  }).join('');
  return `
    <svg viewBox="0 0 200 300" style="width:100%;max-width:260px;display:block;margin:0 auto;">
      <ellipse cx="100" cy="30" rx="18" ry="20" fill="#3a3f4b"/>
      <rect x="70" y="48" width="60" height="140" rx="18" fill="#2a2e38"/>
      <rect x="40" y="55" width="18" height="90" rx="9" fill="#2a2e38"/>
      <rect x="142" y="55" width="18" height="90" rx="9" fill="#2a2e38"/>
      <rect x="80" y="185" width="18" height="100" rx="9" fill="#2a2e38"/>
      <rect x="102" y="185" width="18" height="100" rx="9" fill="#2a2e38"/>
      ${zones}
    </svg>
  `;
}

function getWeekLabel(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const day = d.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(d);
  monday.setDate(d.getDate() + diffToMonday);
  return monday.toISOString().slice(0,10);
}

async function getAllSavedEntries() {
  let keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('workout:')) keys.push(k);
    }
  } catch (e) {}
  const entries = [];
  for (const k of keys) {
    const dateStr = k.replace('workout:', '');
    const e = await loadEntry(dateStr);
    if (e.saved) entries.push(e);
  }
  return entries.sort((a,b) => a.date.localeCompare(b.date));
}

function getAllExerciseNames() {
  const names = new Set();
  DAY_KEYS.forEach(dayKey => PROGRAM[dayKey].exercises.forEach(ex => names.add(ex.name)));
  return Array.from(names);
}

function renderProgressChart(weeklyData) {
  if (weeklyData.length === 0) {
    return '<div class="empty-state">Пока нет сохранённых тренировок с этим упражнением</div>';
  }
  const W = 320, H = 160, PAD = 30;
  const maxWeight = Math.max(...weeklyData.map(w => w.maxWeight), 1);
  const maxSets = Math.max(...weeklyData.map(w => w.totalSets), 1);
  const stepX = weeklyData.length > 1 ? (W - PAD*2) / (weeklyData.length - 1) : 0;

  const weightPoints = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const y = H - PAD - (w.maxWeight / maxWeight) * (H - PAD*2);
    return `${x},${y}`;
  }).join(' ');

  const bars = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const barH = (w.totalSets / maxSets) * (H - PAD*2) * 0.4;
    return `<rect x="${x-6}" y="${H-PAD-barH}" width="12" height="${barH}" fill="var(--accent2)" fill-opacity="0.5"/>`;
  }).join('');

  const labels = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const d = new Date(w.week + "T12:00:00");
    const lbl = `${d.getDate()}.${d.getMonth()+1}`;
    return `<text x="${x}" y="${H-8}" font-size="9" fill="var(--text-dim)" text-anchor="middle">${lbl}</text>`;
  }).join('');

  const dots = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const y = H - PAD - (w.maxWeight / maxWeight) * (H - PAD*2);
    return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;">
      ${bars}
      <polyline points="${weightPoints}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
    <div style="display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-top:6px;justify-content:center;">
      <span>🔵 Макс. вес по неделям</span>
      <span>🟢 Кол-во подходов</span>
    </div>
  `;
}

async function renderAnalyticsView() {
  const main = document.getElementById('mainContent');
  document.getElementById('pageTitle').textContent = 'Аналитика';
  main.innerHTML = '<div class="empty-state">Загрузка...</div>';

  const totals = computeWeeklyMuscleVolume();
  const bodyHtml = renderBodySvg(totals);

  const barsHtml = Object.keys(MUSCLE_LABELS).filter(m => m !== 'neck' && m !== 'other' && totals[m] !== undefined).map(m => {
    const sets = totals[m] || 0;
    const isPriority = PRIORITY_MUSCLES.includes(m);
    const status = getVolumeStatus(sets, isPriority);
    const pct = Math.min(100, (sets / MIN_OPTIMAL_SETS) * 100);
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span>${MUSCLE_LABELS[m]}${isPriority ? ' ⭐' : ''}</span>
          <span style="color:${status.color};">${sets} подх/нед · ${status.label}</span>
        </div>
        <div style="background:var(--card2);border-radius:6px;height:8px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:${status.color};"></div>
        </div>
      </div>
    `;
  }).join('');

  // Recommendations
  const recs = [];
  PRIORITY_MUSCLES.forEach(m => {
    const sets = totals[m] || 0;
    if (sets < LOWER_BOUND_SETS) {
      recs.push(`<b>${MUSCLE_LABELS[m]}</b> — всего ${sets} подх/нед, это ниже минимума (8). Приоритетная зона по твоим целям, стоит добавить упражнение или 1-2 подхода.`);
    } else if (sets < MIN_OPTIMAL_SETS) {
      recs.push(`<b>${MUSCLE_LABELS[m]}</b> — ${sets} подх/нед, на нижней границе. Можно добавить 1 подход для более уверенного роста.`);
    }
  });
  ['quads','glutes','calves','lowerback'].forEach(m => {
    const sets = totals[m] || 0;
    if (sets < LOWER_BOUND_SETS) {
      recs.push(`<span style="color:var(--text-dim);">${MUSCLE_LABELS[m]} — ${sets} подх/нед, ниже нормы, но это не приоритет сейчас, можно оставить как есть.</span>`);
    }
  });
  const recsHtml = recs.length
    ? `<ul style="padding-left:18px;margin:0;">${recs.map(r => `<li style="margin-bottom:8px;font-size:13px;">${r}</li>`).join('')}</ul>`
    : `<div style="font-size:13px;color:var(--accent2);">Все приоритетные группы в норме 👍</div>`;

  main.innerHTML = `
    <div class="section-title">Недельный объём по группам мышц</div>
    <div class="exercise-card">${bodyHtml}</div>
    <div class="exercise-card">${barsHtml}</div>
    <div class="section-title">Рекомендации (⭐ = приоритет — верх тела)</div>
    <div class="exercise-card">${recsHtml}</div>
    <div class="section-title">Прогрессия по упражнению</div>
    <div class="exercise-card">
      <select id="exerciseSelect" style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px;font-size:14px;margin-bottom:12px;"></select>
      <div id="progressChartWrap"></div>
    </div>
  `;

  const exerciseNames = getAllExerciseNames();
  const select = document.getElementById('exerciseSelect');
  select.innerHTML = exerciseNames.map(n => `<option value="${n}">${n}</option>`).join('');

  const savedEntries = await getAllSavedEntries();

  async function updateChart() {
    const chosen = select.value;
    const weekMap = {};
    savedEntries.forEach(entry => {
      const ex = entry.exercises.find(e => e.name === chosen);
      if (!ex || !ex.sets || ex.sets.length === 0) return;
      const week = getWeekLabel(entry.date);
      if (!weekMap[week]) weekMap[week] = { week, maxWeight: 0, totalSets: 0 };
      ex.sets.forEach(s => {
        const w = parseFloat(s.weight);
        if (!isNaN(w) && w > weekMap[week].maxWeight) weekMap[week].maxWeight = w;
        if (s.weight || s.reps) weekMap[week].totalSets += 1;
      });
    });
    const weeklyData = Object.values(weekMap).sort((a,b) => a.week.localeCompare(b.week));
    document.getElementById('progressChartWrap').innerHTML = renderProgressChart(weeklyData);
  }

  select.onchange = updateChart;
  await updateChart();
}

function renderGroupTabs() {
  const groupDiv = document.getElementById('groupTabs');
  groupDiv.innerHTML = '';
  const groups = [
    { key: 'gym', label: '🏋️ Зал' },
    { key: 'home', label: '🏠 Дом' }
  ];
  groups.forEach(g => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (g.key === currentGroup ? ' active' : '');
    tab.textContent = g.label;
    tab.onclick = () => {
      currentGroup = g.key;
      const dayList = g.key === 'gym' ? GYM_DAYS : HOME_DAYS;
      if (!dayList.includes(currentDayKey)) {
        currentDayKey = dayList[0];
        syncDateToDay();
      }
      render();
    };
    groupDiv.appendChild(tab);
  });
}

function renderDayTabs() {
  const tabsDiv = document.getElementById('dayTabs');
  tabsDiv.innerHTML = '';
  const dayList = currentGroup === 'gym' ? GYM_DAYS : HOME_DAYS;
  dayList.forEach(key => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (key === currentDayKey ? ' active' : '');
    tab.textContent = PROGRAM[key].label.slice(0,3);
    tab.onclick = () => {
      currentDayKey = key;
      syncDateToDay();
      render();
    };
    tabsDiv.appendChild(tab);
  });
}

function syncDateToDay() {
  // Move currentDate to the day-of-week matching currentDayKey, staying in the same week as currentDate
  const d = new Date(currentDate + "T12:00:00");
  const curJsDay = d.getDay();
  const curIdx = DAY_ORDER_JS.indexOf(curJsDay);
  const targetIdx = DAY_KEYS.indexOf(currentDayKey);
  const diff = targetIdx - curIdx;
  d.setDate(d.getDate() + diff);
  currentDate = d.toISOString().slice(0,10);
  document.getElementById('dateInput').value = currentDate;
}

async function render() {
  renderGroupTabs();
  renderDayTabs();
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === currentView);
  });
  document.getElementById('dateRow').style.display = (currentView === 'history' || currentView === 'analytics') ? 'none' : 'flex';
  document.getElementById('groupTabs').style.display = currentView === 'workout' ? 'flex' : 'none';
  document.getElementById('dayTabs').style.display = currentView === 'workout' ? 'flex' : 'none';

  if (currentView === 'workout') await renderWorkoutView();
  else if (currentView === 'history') await renderHistoryView();
  else if (currentView === 'weight') await renderWeightView();
  else if (currentView === 'analytics') await renderAnalyticsView();
}

document.getElementById('dateInput').value = currentDate;
document.getElementById('dateInput').onchange = (e) => {
  currentDate = e.target.value;
  currentDayKey = getDayKeyFromDate(currentDate);
  currentGroup = PROGRAM[currentDayKey].location;
  render();
};

// Timestamp of the user's last keystroke anywhere in the app. A cloud pull
// replaces the in-memory entry, so we must never do it mid-edit or the
// unsaved values get thrown away.
let lastEditAt = 0;
document.addEventListener('input', () => { lastEditAt = Date.now(); }, true);

// Re-pull from the cloud, then refresh the current view — but only when the
// user is NOT entering data, so we don't clobber unsaved edits.
async function backgroundSync() {
  const editing = document.activeElement &&
    ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
  if (editing || Date.now() - lastEditAt < 4000) return;
  const ok = await pullFromCloud();
  if (ok) render();
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    currentView = btn.dataset.view;
    if (currentView === 'history') historyMonth = null; // open on latest month
    render();          // instant paint from local data
    backgroundSync();  // then pull fresh cloud data and re-render if safe
  };
});

// Refresh when returning to the app (switching back from another device/tab).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') backgroundSync();
});

(async () => {
  await pullFromCloud();   // fetch + merge cloud data before first paint
  render();
})();
</script>
