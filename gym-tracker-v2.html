const MUSCLE_LABELS = {
  chest: "Грудь", shoulders: "Плечи (дельты)", triceps: "Трицепс", back: "Спина",
  biceps: "Бицепс", abs: "Пресс/кор", quads: "Квадрицепс", glutes: "Ягодицы",
  calves: "Икры", lowerback: "Низ спины", neck: "Шея", other: "—"
};
const PRIORITY_MUSCLES = ["chest","shoulders","back","biceps","triceps"];
const MIN_OPTIMAL_SETS = 12;
const LOWER_BOUND_SETS = 8;

const DAY_KEYS = ["mon","tue","wed","thu","fri","sat","sun"];
const GYM_DAYS = DAY_KEYS.filter(k => PROGRAM[k].location === "gym");
const HOME_DAYS = DAY_KEYS.filter(k => PROGRAM[k].location === "home");
const DAY_ORDER_JS = [1,2,3,4,5,6,0]; // JS getDay() mapping: mon=1...sun=0

let currentView = "workout";
let currentDate = new Date().toISOString().slice(0,10);
let currentDayKey = getDayKeyFromDate(currentDate);
let currentGroup = PROGRAM[currentDayKey].location; // "gym" or "home"
let cache = {}; // in-memory cache of loaded workout entries by date
let cardioCache = {}; // date -> bool

/* ---------------- Cloud sync (JSONBin.io) ----------------
   Local storage stays the fast, offline-first source of truth.
   On top of it we keep one JSONBin "bin" that mirrors the full
   local state so data is shared across devices. Merge is
   newest-wins per record, with tombstones for deletions. */
const JSONBIN_BIN_ID = '6a663a6dda38895dfe929fb0';
const JSONBIN_API_KEY = '$2a$10$wML42Whm9PTySaI27gM/SO3xEujr2zJkt/A7H8NksvT6qaIGDeEmm';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
const TOMBSTONE_KEY = 'deleted-workouts'; // { "YYYY-MM-DD": deletedAtTs }

function readJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return (v === null || v === undefined) ? fallback : v;
  } catch (e) { return fallback; }
}

function setSyncStatus(text, cls) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (cls ? ' ' + cls : '');
}

// Full snapshot of everything stored locally.
function collectLocalState() {
  const workouts = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('workout:')) {
      const entry = readJSON(k, null);
      if (entry) workouts[k.slice('workout:'.length)] = entry;
    }
  }
  return {
    _savedAt: Date.now(),
    workouts,
    bodyweight: readJSON('bodyweight-log', {}),
    deleted: readJSON(TOMBSTONE_KEY, {})
  };
}

// Write a (merged) snapshot back into localStorage.
function applyState(state) {
  if (!state || typeof state !== 'object') return;
  const deleted = state.deleted || {};
  if (state.workouts) {
    for (const [date, entry] of Object.entries(state.workouts)) {
      localStorage.setItem('workout:' + date, JSON.stringify(entry));
    }
  }
  for (const date of Object.keys(deleted)) {
    localStorage.removeItem('workout:' + date);
  }
  if (state.bodyweight) localStorage.setItem('bodyweight-log', JSON.stringify(state.bodyweight));
  localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(deleted));
  cache = {}; // in-memory cache is stale after a merge
}

// Merge two snapshots without losing data. Newest-wins per record.
function mergeStates(local, remote) {
  if (!remote) return local;
  if (!local) return remote;

  // Tombstones: keep the newest deletion time per date.
  const deleted = {};
  for (const src of [local.deleted || {}, remote.deleted || {}]) {
    for (const [d, ts] of Object.entries(src)) {
      deleted[d] = Math.max(deleted[d] || 0, ts || 0);
    }
  }

  // Workouts: union of dates, newest _ts wins; a later deletion removes it.
  const workouts = {};
  const dates = new Set([...Object.keys(local.workouts || {}), ...Object.keys(remote.workouts || {})]);
  for (const d of dates) {
    const a = (local.workouts || {})[d];
    const b = (remote.workouts || {})[d];
    const chosen = !a ? b : !b ? a : ((a._ts || 0) >= (b._ts || 0) ? a : b);
    const delTs = deleted[d] || 0;
    if (delTs && delTs >= (chosen._ts || 0)) continue; // deletion is newer
    workouts[d] = chosen;
  }

  // Bodyweight: merge keys; on conflict the newer snapshot wins.
  const localNewer = (local._savedAt || 0) >= (remote._savedAt || 0);
  const bodyweight = localNewer
    ? { ...(remote.bodyweight || {}), ...(local.bodyweight || {}) }
    : { ...(local.bodyweight || {}), ...(remote.bodyweight || {}) };

  return {
    _savedAt: Math.max(local._savedAt || 0, remote._savedAt || 0),
    workouts, bodyweight, deleted
  };
}

// Pull remote, merge into local. Pushes back if the merge added anything.
async function pullFromCloud() {
  setSyncStatus('↕ синхронизация…', 'syncing');
  try {
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    const rec = body.record;
    const remote = (rec && (rec.workouts || rec.bodyweight || rec.deleted)) ? rec : null;
    const local = collectLocalState();
    const merged = mergeStates(local, remote);
    applyState(merged);

    const mergedSnap = JSON.stringify({ w: merged.workouts, b: merged.bodyweight, d: merged.deleted });
    const remoteSnap = remote
      ? JSON.stringify({ w: remote.workouts || {}, b: remote.bodyweight || {}, d: remote.deleted || {} })
      : null;
    if (mergedSnap !== remoteSnap) schedulePush(); // remote is missing local data

    setSyncStatus('☁ синхронизировано', 'ok');
    return true;
  } catch (e) {
    console.error('Cloud pull failed', e);
    setSyncStatus('⚠ офлайн', 'err');
    return false;
  }
}

// Push the full local snapshot to the cloud (debounced via schedulePush).
let pushInFlight = false;
let pushQueued = false;
async function pushToCloud() {
  if (pushInFlight) { pushQueued = true; return; }
  pushInFlight = true;
  setSyncStatus('↕ синхронизация…', 'syncing');
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(collectLocalState())
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setSyncStatus('☁ синхронизировано', 'ok');
  } catch (e) {
    console.error('Cloud push failed', e);
    setSyncStatus('⚠ не сохранено в облако', 'err');
  } finally {
    pushInFlight = false;
    if (pushQueued) { pushQueued = false; schedulePush(); }
  }
}
const schedulePush = debounce(pushToCloud, 1200);

function markDeleted(dateStr) {
  const tomb = readJSON(TOMBSTONE_KEY, {});
  tomb[dateStr] = Date.now();
  localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tomb));
}
function clearTombstone(dateStr) {
  const tomb = readJSON(TOMBSTONE_KEY, {});
  if (tomb[dateStr]) {
    delete tomb[dateStr];
    localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(tomb));
  }
}

function getDayKeyFromDate(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const jsDay = d.getDay(); // 0=sun
  const idx = DAY_ORDER_JS.indexOf(jsDay);
  return DAY_KEYS[idx];
}

function getCutoffMonday() {
  const now = new Date();
  const day = now.getDay(); // 0=sun..6=sat
  let daysUntilNextMonday = (8 - day) % 7;
  if (daysUntilNextMonday === 0) daysUntilNextMonday = 7;
  const d = new Date(now);
  d.setDate(now.getDate() + daysUntilNextMonday);
  return d.toISOString().slice(0,10);
}
const CUTOFF_MONDAY = getCutoffMonday();
function isBeforeCutoff(dateStr) {
  return dateStr < CUTOFF_MONDAY;
}

function formatDateHuman(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const months = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

async function loadEntry(dateStr) {
  if (cache[dateStr]) return cache[dateStr];
  try {
    const raw = localStorage.getItem(`workout:${dateStr}`);
    if (raw) {
      const parsed = JSON.parse(raw);
      cache[dateStr] = parsed;
      return parsed;
    }
  } catch (e) {}
  const dayKey = getDayKeyFromDate(dateStr);
  const template = PROGRAM[dayKey];
  const fresh = {
    date: dateStr,
    dayKey: dayKey,
    cardio: false,
    chinTucks: false,
    kegelMorning: false,
    kegelAfternoon: false,
    kegelEvening: false,
    saved: false,
    exercises: template.exercises.map(ex => ({
      name: ex.name,
      target: ex.target,
      muscle: ex.muscle,
      done: false,
      notes: '',
      sets: []
    }))
  };
  cache[dateStr] = fresh;
  return fresh;
}

async function saveEntry(dateStr) {
  const entry = cache[dateStr];
  if (!entry) return;
  try {
    entry._ts = Date.now();
    localStorage.setItem(`workout:${dateStr}`, JSON.stringify(entry));
    clearTombstone(dateStr);
    showToast();
    schedulePush();
  } catch (e) {
    console.error("Save failed", e);
  }
}

function showToast() {
  const t = document.getElementById('saveToast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}
const debouncedSave = debounce(saveEntry, 500);

async function renderHistoryView() {
  const main = document.getElementById('mainContent');
  document.getElementById('pageTitle').textContent = 'История';
  main.innerHTML = '<div class="empty-state">Загрузка...</div>';

  let keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('workout:')) keys.push(k);
    }
  } catch (e) {
    keys = [];
  }

  if (keys.length === 0) {
    main.innerHTML = '<div class="empty-state">Пока нет записей.<br>Заполни тренировку — она появится здесь.</div>';
    return;
  }

  const dates = keys.map(k => k.replace('workout:', '')).sort().reverse();
  main.innerHTML = '';

  for (const dateStr of dates) {
    const entry = await loadEntry(dateStr);
    if (!entry.saved) continue;

    const el = document.createElement('div');
    el.className = 'history-entry';
    const template = PROGRAM[entry.dayKey];
    let exHtml = '';
    entry.exercises.forEach(ex => {
      if (ex.sets.length === 0 && !ex.done) return;
      const setsStr = ex.sets.filter(s => s.weight || s.reps)
        .map(s => `${s.weight || '-'}кг×${s.reps || '-'}`).join(', ');
      exHtml += `<div class="history-ex"><span class="ename">${ex.done ? '✓ ' : ''}${ex.name}:</span> ${setsStr || '—'}</div>`;
    });
    const dailyBits = [];
    if (entry.chinTucks) dailyBits.push('Chin tucks');
    const kegelCount = [entry.kegelMorning, entry.kegelAfternoon, entry.kegelEvening].filter(Boolean).length;
    if (kegelCount > 0) dailyBits.push(`Кегель ${kegelCount}/3`);
    const dailyHtml = dailyBits.length ? `<div class="history-ex" style="color:var(--accent2);">${dailyBits.join(' · ')}</div>` : '';

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="history-date">${formatDateHuman(dateStr)}</div>
          <div class="history-day">${template.type}${entry.cardio ? ' + кардио' : ''}</div>
        </div>
        <button class="history-delete-btn" data-date="${dateStr}">🗑</button>
      </div>
      ${exHtml}
      ${dailyHtml}
    `;
    el.querySelector('.history-delete-btn').onclick = async (ev) => {
      ev.stopPropagation();
      const btn = ev.currentTarget;
      if (btn.dataset.confirming === 'true') {
        try {
          localStorage.removeItem(`workout:${dateStr}`);
          delete cache[dateStr];
          markDeleted(dateStr);
          schedulePush();
        } catch (e) {}
        renderHistoryView();
      } else {
        btn.dataset.confirming = 'true';
        btn.textContent = '✓ Точно?';
        btn.style.color = 'var(--danger)';
        setTimeout(() => {
          if (btn.dataset.confirming === 'true') {
            btn.dataset.confirming = 'false';
            btn.textContent = '🗑';
            btn.style.color = '';
          }
        }, 3000);
      }
    };
    main.appendChild(el);
  }

  if (main.innerHTML === '') {
    main.innerHTML = '<div class="empty-state">Пока нет записей.<br>Заполни тренировку — она появится здесь.</div>';
  }
}

// ---------- ANALYTICS ----------

function computeWeeklyMuscleVolume() {
  const totals = {};
  DAY_KEYS.forEach(dayKey => {
    PROGRAM[dayKey].exercises.forEach(ex => {
      if (!ex.muscle || ex.muscle === 'neck' || ex.muscle === 'other') return;
      const match = ex.target.match(/^(\d+)/);
      const sets = match ? parseInt(match[1], 10) : 0;
      totals[ex.muscle] = (totals[ex.muscle] || 0) + sets;
    });
  });
  return totals;
}

function getVolumeStatus(sets, isPriority) {
  if (sets < LOWER_BOUND_SETS) return { label: 'Мало', color: '#f87171' };
  if (sets < MIN_OPTIMAL_SETS) return { label: isPriority ? 'Погранично' : 'Норм', color: '#fbbf24' };
  return { label: 'Хорошо', color: '#34d399' };
}

const BODY_ZONES = {
  chest:     { cx: 100, cy: 95,  rx: 26, ry: 18 },
  shoulders: { cx: 100, cy: 65,  rx: 42, ry: 14 },
  biceps:    { cx: 60,  cy: 110, rx: 10, ry: 22 },
  triceps:   { cx: 140, cy: 110, rx: 10, ry: 22 },
  back:      { cx: 100, cy: 95,  rx: 26, ry: 18 },
  abs:       { cx: 100, cy: 135, rx: 18, ry: 22 },
  quads:     { cx: 100, cy: 210, rx: 22, ry: 35 },
  glutes:    { cx: 100, cy: 175, rx: 22, ry: 14 },
  calves:    { cx: 100, cy: 275, rx: 14, ry: 24 },
  lowerback: { cx: 100, cy: 160, rx: 20, ry: 12 }
};

function renderBodySvg(totals) {
  const zones = Object.entries(BODY_ZONES).map(([muscle, z]) => {
    const sets = totals[muscle] || 0;
    const isPriority = PRIORITY_MUSCLES.includes(muscle);
    const status = getVolumeStatus(sets, isPriority);
    return `<ellipse cx="${z.cx}" cy="${z.cy}" rx="${z.rx}" ry="${z.ry}" fill="${status.color}" fill-opacity="0.55" stroke="${status.color}" stroke-width="2"/>
      <text x="${z.cx}" y="${z.cy+4}" font-size="9" fill="white" text-anchor="middle">${sets}</text>`;
  }).join('');
  return `
    <svg viewBox="0 0 200 300" style="width:100%;max-width:260px;display:block;margin:0 auto;">
      <ellipse cx="100" cy="30" rx="18" ry="20" fill="#3a3f4b"/>
      <rect x="70" y="48" width="60" height="140" rx="18" fill="#2a2e38"/>
      <rect x="40" y="55" width="18" height="90" rx="9" fill="#2a2e38"/>
      <rect x="142" y="55" width="18" height="90" rx="9" fill="#2a2e38"/>
      <rect x="80" y="185" width="18" height="100" rx="9" fill="#2a2e38"/>
      <rect x="102" y="185" width="18" height="100" rx="9" fill="#2a2e38"/>
      ${zones}
    </svg>
  `;
}

function getWeekLabel(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const day = d.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(d);
  monday.setDate(d.getDate() + diffToMonday);
  return monday.toISOString().slice(0,10);
}

async function getAllSavedEntries() {
  let keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('workout:')) keys.push(k);
    }
  } catch (e) {}
  const entries = [];
  for (const k of keys) {
    const dateStr = k.replace('workout:', '');
    const e = await loadEntry(dateStr);
    if (e.saved) entries.push(e);
  }
  return entries.sort((a,b) => a.date.localeCompare(b.date));
}

function getAllExerciseNames() {
  const names = new Set();
  DAY_KEYS.forEach(dayKey => PROGRAM[dayKey].exercises.forEach(ex => names.add(ex.name)));
  return Array.from(names);
}

function renderProgressChart(weeklyData) {
  if (weeklyData.length === 0) {
    return '<div class="empty-state">Пока нет сохранённых тренировок с этим упражнением</div>';
  }
  const W = 320, H = 160, PAD = 30;
  const maxWeight = Math.max(...weeklyData.map(w => w.maxWeight), 1);
  const maxSets = Math.max(...weeklyData.map(w => w.totalSets), 1);
  const stepX = weeklyData.length > 1 ? (W - PAD*2) / (weeklyData.length - 1) : 0;

  const weightPoints = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const y = H - PAD - (w.maxWeight / maxWeight) * (H - PAD*2);
    return `${x},${y}`;
  }).join(' ');

  const bars = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const barH = (w.totalSets / maxSets) * (H - PAD*2) * 0.4;
    return `<rect x="${x-6}" y="${H-PAD-barH}" width="12" height="${barH}" fill="var(--accent2)" fill-opacity="0.5"/>`;
  }).join('');

  const labels = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const d = new Date(w.week + "T12:00:00");
    const lbl = `${d.getDate()}.${d.getMonth()+1}`;
    return `<text x="${x}" y="${H-8}" font-size="9" fill="var(--text-dim)" text-anchor="middle">${lbl}</text>`;
  }).join('');

  const dots = weeklyData.map((w, i) => {
    const x = PAD + i * stepX;
    const y = H - PAD - (w.maxWeight / maxWeight) * (H - PAD*2);
    return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;">
      ${bars}
      <polyline points="${weightPoints}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
    <div style="display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-top:6px;justify-content:center;">
      <span>🔵 Макс. вес по неделям</span>
      <span>🟢 Кол-во подходов</span>
    </div>
  `;
}

async function renderAnalyticsView() {
  const main = document.getElementById('mainContent');
  document.getElementById('pageTitle').textContent = 'Аналитика';
  main.innerHTML = '<div class="empty-state">Загрузка...</div>';

  const totals = computeWeeklyMuscleVolume();
  const bodyHtml = renderBodySvg(totals);

  const barsHtml = Object.keys(MUSCLE_LABELS).filter(m => m !== 'neck' && m !== 'other' && totals[m] !== undefined).map(m => {
    const sets = totals[m] || 0;
    const isPriority = PRIORITY_MUSCLES.includes(m);
    const status = getVolumeStatus(sets, isPriority);
    const pct = Math.min(100, (sets / MIN_OPTIMAL_SETS) * 100);
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span>${MUSCLE_LABELS[m]}${isPriority ? ' ⭐' : ''}</span>
          <span style="color:${status.color};">${sets} подх/нед · ${status.label}</span>
        </div>
        <div style="background:var(--card2);border-radius:6px;height:8px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:${status.color};"></div>
        </div>
      </div>
    `;
  }).join('');

  // Recommendations
  const recs = [];
  PRIORITY_MUSCLES.forEach(m => {
    const sets = totals[m] || 0;
    if (sets < LOWER_BOUND_SETS) {
      recs.push(`<b>${MUSCLE_LABELS[m]}</b> — всего ${sets} подх/нед, это ниже минимума (8). Приоритетная зона по твоим целям, стоит добавить упражнение или 1-2 подхода.`);
    } else if (sets < MIN_OPTIMAL_SETS) {
      recs.push(`<b>${MUSCLE_LABELS[m]}</b> — ${sets} подх/нед, на нижней границе. Можно добавить 1 подход для более уверенного роста.`);
    }
  });
  ['quads','glutes','calves','lowerback'].forEach(m => {
    const sets = totals[m] || 0;
    if (sets < LOWER_BOUND_SETS) {
      recs.push(`<span style="color:var(--text-dim);">${MUSCLE_LABELS[m]} — ${sets} подх/нед, ниже нормы, но это не приоритет сейчас, можно оставить как есть.</span>`);
    }
  });
  const recsHtml = recs.length
    ? `<ul style="padding-left:18px;margin:0;">${recs.map(r => `<li style="margin-bottom:8px;font-size:13px;">${r}</li>`).join('')}</ul>`
    : `<div style="font-size:13px;color:var(--accent2);">Все приоритетные группы в норме 👍</div>`;

  main.innerHTML = `
    <div class="section-title">Недельный объём по группам мышц</div>
    <div class="exercise-card">${bodyHtml}</div>
    <div class="exercise-card">${barsHtml}</div>
    <div class="section-title">Рекомендации (⭐ = приоритет — верх тела)</div>
    <div class="exercise-card">${recsHtml}</div>
    <div class="section-title">Прогрессия по упражнению</div>
    <div class="exercise-card">
      <select id="exerciseSelect" style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px;font-size:14px;margin-bottom:12px;"></select>
      <div id="progressChartWrap"></div>
    </div>
  `;

  const exerciseNames = getAllExerciseNames();
  const select = document.getElementById('exerciseSelect');
  select.innerHTML = exerciseNames.map(n => `<option value="${n}">${n}</option>`).join('');

  const savedEntries = await getAllSavedEntries();

  async function updateChart() {
    const chosen = select.value;
    const weekMap = {};
    savedEntries.forEach(entry => {
      const ex = entry.exercises.find(e => e.name === chosen);
      if (!ex || !ex.sets || ex.sets.length === 0) return;
      const week = getWeekLabel(entry.date);
      if (!weekMap[week]) weekMap[week] = { week, maxWeight: 0, totalSets: 0 };
      ex.sets.forEach(s => {
        const w = parseFloat(s.weight);
        if (!isNaN(w) && w > weekMap[week].maxWeight) weekMap[week].maxWeight = w;
        if (s.weight || s.reps) weekMap[week].totalSets += 1;
      });
    });
    const weeklyData = Object.values(weekMap).sort((a,b) => a.week.localeCompare(b.week));
    document.getElementById('progressChartWrap').innerHTML = renderProgressChart(weeklyData);
  }

  select.onchange = updateChart;
  await updateChart();
}

function renderGroupTabs() {
  const groupDiv = document.getElementById('groupTabs');
  groupDiv.innerHTML = '';
  const groups = [
    { key: 'gym', label: '🏋️ Зал' },
    { key: 'home', label: '🏠 Дом' }
  ];
  groups.forEach(g => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (g.key === currentGroup ? ' active' : '');
    tab.textContent = g.label;
    tab.onclick = () => {
      currentGroup = g.key;
      const dayList = g.key === 'gym' ? GYM_DAYS : HOME_DAYS;
      if (!dayList.includes(currentDayKey)) {
        currentDayKey = dayList[0];
        syncDateToDay();
      }
      render();
    };
    groupDiv.appendChild(tab);
  });
}

function renderDayTabs() {
  const tabsDiv = document.getElementById('dayTabs');
  tabsDiv.innerHTML = '';
  const dayList = currentGroup === 'gym' ? GYM_DAYS : HOME_DAYS;
  dayList.forEach(key => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (key === currentDayKey ? ' active' : '');
    tab.textContent = PROGRAM[key].label.slice(0,3);
    tab.onclick = () => {
      currentDayKey = key;
      syncDateToDay();
      render();
    };
    tabsDiv.appendChild(tab);
  });
}

function syncDateToDay() {
  // Move currentDate to the day-of-week matching currentDayKey, staying in the same week as currentDate
  const d = new Date(currentDate + "T12:00:00");
  const curJsDay = d.getDay();
  const curIdx = DAY_ORDER_JS.indexOf(curJsDay);
  const targetIdx = DAY_KEYS.indexOf(currentDayKey);
  const diff = targetIdx - curIdx;
  d.setDate(d.getDate() + diff);
  currentDate = d.toISOString().slice(0,10);
  document.getElementById('dateInput').value = currentDate;
}

async function render() {
  renderGroupTabs();
  renderDayTabs();
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === currentView);
  });
  document.getElementById('dateRow').style.display = (currentView === 'history' || currentView === 'analytics') ? 'none' : 'flex';
  document.getElementById('groupTabs').style.display = currentView === 'workout' ? 'flex' : 'none';
  document.getElementById('dayTabs').style.display = currentView === 'workout' ? 'flex' : 'none';

  if (currentView === 'workout') await renderWorkoutView();
  else if (currentView === 'history') await renderHistoryView();
  else if (currentView === 'weight') await renderWeightView();
  else if (currentView === 'analytics') await renderAnalyticsView();
}

document.getElementById('dateInput').value = currentDate;
document.getElementById('dateInput').onchange = (e) => {
  currentDate = e.target.value;
  currentDayKey = getDayKeyFromDate(currentDate);
  currentGroup = PROGRAM[currentDayKey].location;
  render();
};

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    currentView = btn.dataset.view;
    render();
  };
});

(async () => {
  await pullFromCloud();   // fetch + merge cloud data before first paint
  render();
})();
</script>
</body>
</html>
